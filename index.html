<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Hub — Komunitas & Kontak</title>
<style>
:root{--bg:#0d0f1a;--card:#171a2b;--text:#f2f3fa;--muted:#9aa0bd;--line:#262a42;--accent:#7c5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5fb;--card:#fff;--text:#161829;--muted:#666c8a;--line:#e2e4f0}}
:root[data-theme="dark"]{--bg:#0d0f1a;--card:#171a2b;--text:#f2f3fa;--muted:#9aa0bd;--line:#262a42}
:root[data-theme="light"]{--bg:#f4f5fb;--card:#fff;--text:#161829;--muted:#666c8a;--line:#e2e4f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background-image:radial-gradient(600px 300px at 50% -80px,color-mix(in srgb,var(--accent) 35%,transparent),transparent)}
#app{max-width:520px;margin:0 auto;padding:32px 16px 110px}
header{text-align:center;margin-bottom:26px}
.logo{width:88px;height:88px;border-radius:26px;margin:0 auto 14px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#fff));overflow:hidden;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#2ecc71}
h1{margin:12px 0 6px;font-size:28px}
header p{margin:0;color:var(--muted)}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;color:inherit;text-decoration:none;flex-wrap:wrap;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.ico{--c:#7c5cff;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.txt span{color:var(--muted);font-size:13px}
.arrow{color:var(--muted);font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text);text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:34px;white-space:pre-line}
.gear{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer;opacity:.55}
.gear:hover{opacity:1}
.ctl{display:flex;gap:4px;width:100%;justify-content:flex-end}
.ctl button,.x,.mini{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:4px 9px;cursor:pointer}
.ctl button:hover,.x:hover,.mini:hover{border-color:var(--accent)}
.danger{color:#ff6b6b!important}
.sechead{display:flex;gap:6px;align-items:center;margin:26px 0 10px}
.sechead input{flex:1;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.add{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:14px;padding:11px;font:inherit;cursor:pointer;margin-bottom:6px}
.add:hover{border-color:var(--accent);color:var(--text)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5}
.btn{font:inherit;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
input[type=color]{padding:2px;height:38px;width:60px}
input[type=checkbox]{width:auto}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:14px;z-index:20;overflow:auto}
.md{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.md h3{margin:0 0 12px}
.md label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.two{display:flex;gap:8px}
.brow{display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.brow .ck{font-size:12px;display:flex;gap:4px;align-items:center;color:var(--muted)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0 0 14px}
</style>
</head>

<script>
const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,8), clone=o=>JSON.parse(JSON.stringify(o));
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else if(a==='style')e.style.cssText=v;else if(v!==false&&v!=null)e[a]=v}k.flat().forEach(c=>c!=null&&c!==false&&e.append(c.nodeType?c:document.createTextNode(c)));return e};
const P={whatsapp:['💬','WhatsApp','#25D366'],discord:['🎮','Discord','#5865F2'],telegram:['✈️','Telegram','#26A5E4'],instagram:['📸','Instagram','#E1306C'],tiktok:['🎵','TikTok','#ff2d55'],youtube:['▶️','YouTube','#FF0000'],facebook:['👍','Facebook','#1877F2'],x:['✖️','X / Twitter','#8899a6'],website:['🌐','Website','#7c5cff'],email:['✉️','Email','#f59e0b'],custom:['⭐','Kustom (bebas)','#7c5cff']};

const KEY='linkhub:'+location.pathname;

function chip(b){return b.copy?h('button',{class:'chip',onclick:()=>copy(b.url)},(b.label||'Salin')+' ⧉'):h('a',{class:'chip',href:safeUrl(b.url),target:'_blank',rel:'noopener'},b.label||'Buka')}

  if(editing)return h('div',{class:'card'},head,h('div',{class:'chips'},it.buttons.map(chip)),h('div',{class:'ctl'},
    h('button',{onclick:()=>mv(sec.items,i,-1)},'↑'),h('button',{onclick:()=>mv(sec.items,i,1)},'↓'),
    h('button',{onclick:()=>itemForm(sec,i)},'✎ Edit'),h('button',{class:'danger',onclick:()=>{sec.items.splice(i,1);render()}},'✕')));

function render(){

  document.title=p.name;
  app.append(h('header',{},h('div',{class:'logo'},p.logoImg?h('img',{src:p.logoImg,alt:''}):p.logo),p.badge&&h('span',{class:'pill'},p.badge),h('h1',{},p.name),h('p',{},p.desc)));

      h('button',{class:'mini',onclick:()=>mv(s.sections,si,-1)},'↑'),h('button',{class:'mini',onclick:()=>mv(s.sections,si,1)},'↓'),
      h('button',{class:'mini danger',onclick:()=>{if(!sec.items.length||confirm('Hapus bagian ini beserta isinya?')){s.sections.splice(si,1);render()}}},'✕')):h('h2',{},sec.title));
    sec.items.forEach((_,i)=>app.append(card(sec,i)));
    if(editing)app.append(h('button',{class:'add',onclick:()=>itemForm(sec,null)},'＋ Tambah tombol / platform'));
  });
  if(editing)app.append(h('button',{class:'add',onclick:()=>{s.sections.push({id:uid(),title:'Bagian Baru',items:[]});render()}},'＋ Tambah bagian baru'));
  if(s.footer)app.append(h('footer',{},s.footer));
  app.append(editing?h('div',{class:'bar'},h('button',{class:'btn',onclick:profileForm},'👤 Profil'),h('button',{class:'btn',onclick:ioForm},'⇅ Ekspor/Impor'),h('button',{class:'btn',onclick:()=>pinForm(false)},'🔒 PIN'),h('button',{class:'btn',onclick:()=>{editing=false;draft=null;render()}},'Batal'),h('button',{class:'btn pri',onclick:save},'Simpan & Terbitkan'))
    :canEdit&&h('button',{class:'gear',title:'Edit halaman',onclick:gate},'⚙️'));
}
function modal(title,body,acts){const close=()=>$('#modal').replaceChildren();$('#modal').replaceChildren(h('div',{class:'ov',onmousedown:e=>{if(e.target.classList.contains('ov'))close()}},h('div',{class:'md'},h('h3',{},title),body,h('div',{class:'acts'},acts(close)))));return close}
const fld=(l,el)=>[h('label',{class:'f'},l),el];

function itemForm(sec,idx){
  const it=idx==null?{id:uid(),icon:'⭐',title:'',sub:'',color:'#7c5cff',buttons:[{label:'Buka',url:'',copy:false}]}:clone(sec.items[idx]);
  const sel=h('select',{onchange:()=>{const q=P[sel.value];icon.value=q[0];color.value=q[2];if(!title.value||Object.values(P).some(x=>x[1]===title.value))title.value=q[1]}},Object.entries(P).map(([k,v])=>h('option',{value:k},v[1])));
  const icon=h('input',{value:it.icon,maxLength:4,style:'width:80px'}),color=h('input',{type:'color',value:it.color});
  const title=h('input',{value:it.title,placeholder:'mis. Grup WhatsApp'}),sub=h('input',{value:it.sub,placeholder:'mis. Info promo terbaru'});
  const rows=h('div');
  const draw=()=>rows.replaceChildren(...it.buttons.map((b,j)=>h('div',{class:'brow'},
    h('input',{placeholder:'Teks tombol',value:b.label,oninput:e=>b.label=e.target.value}),
    h('input',{placeholder:b.copy?'Teks yang disalin':'Link https://…',value:b.url,oninput:e=>b.url=e.target.value}),
    h('label',{class:'ck'},h('input',{type:'checkbox',checked:b.copy,onchange:e=>{b.copy=e.target.checked;draw()}}),'Salin'),
    h('button',{class:'x danger',onclick:()=>{it.buttons.splice(j,1);draw()}},'✕'))));
  draw();
  const body=h('div',{},fld('Pilih platform (isi otomatis ikon & warna)',sel),h('div',{class:'two'},h('div',{},fld('Ikon / emoji',icon)),h('div',{},fld('Warna',color))),fld('Judul',title),fld('Keterangan (opsional)',sub),h('label',{class:'f'},'Tombol (bisa lebih dari satu)'),rows,h('button',{class:'mini',onclick:()=>{it.buttons.push({label:'',url:'',copy:false});draw()}},'＋ Tambah tombol'));
  modal(idx==null?'Tambah Platform / Tombol':'Edit Platform / Tombol',body,close=>[h('button',{class:'btn',onclick:close},'Batal'),h('button',{class:'btn pri',onclick:()=>{
    if(!title.value.trim())return toast('Judul wajib diisi');
    Object.assign(it,{icon:icon.value||'⭐',color:color.value,title:title.value.trim(),sub:sub.value.trim()});
    if(!it.buttons.length)return toast('Tambahkan minimal 1 tombol');
    idx==null?sec.items.push(it):sec.items[idx]=it;close();render()}},'Simpan')]);
}
function profileForm(){
  const p=draft.profile,i={};
  ['name','badge','desc','logo'].forEach(k=>i[k]=h(k==='desc'?'textarea':'input',{value:p[k]||'',rows:3}));
  i.footer=h('textarea',{value:draft.footer||'',rows:2});i.accent=h('input',{type:'color',value:p.accent||'#7c5cff'});
  let img=p.logoImg||'';
  const file=h('input',{type:'file',accept:'image/*',onchange:e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=h('canvas',{width:160,height:160}),x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);img=c.toDataURL('image/webp',.85);toast('Logo siap ✓')};im.src=URL.createObjectURL(f)}});
  const body=h('div',{},fld('Nama',i.name),fld('Label status (kosongkan untuk menyembunyikan)',i.badge),fld('Deskripsi',i.desc),fld('Logo emoji / teks',i.logo),fld('…atau unggah gambar logo',file),h('button',{class:'mini',style:'margin-top:6px',onclick:()=>{img='';toast('Logo gambar dihapus')}},'Hapus gambar logo'),fld('Warna utama',i.accent),fld('Teks footer',i.footer));
  modal('Profil Halaman',body,close=>[h('button',{class:'btn',onclick:close},'Batal'),h('button',{class:'btn pri',onclick:()=>{Object.assign(p,{name:i.name.value,badge:i.badge.value,desc:i.desc.value,logo:i.logo.value,logoImg:img,accent:i.accent.value});draft.footer=i.footer.value;close();render()}},'Terapkan')]);
}
function ioForm(){
  const ta=h('textarea',{rows:10,value:JSON.stringify(draft,null,1),style:'font-family:monospace;font-size:12px'});
  modal('Ekspor / Impor Data',h('div',{},h('p',{class:'note'},'Salin teks ini sebagai cadangan. Tempel data cadangan lalu tekan Terapkan untuk memulihkan.'),ta),close=>[h('button',{class:'btn',onclick:()=>copy(ta.value)},'Salin'),h('button',{class:'btn pri',onclick:()=>{try{const d=JSON.parse(ta.value);if(!d.profile||!Array.isArray(d.sections))throw 0;d.security=draft.security;draft=d;close();render()}catch{toast('Format data tidak valid')}}},'Terapkan')]);
}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPin(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:ub64(salt),iterations:250000},k,256))}
const enter=()=>{draft=clone(state);editing=true;render();scrollTo(0,0)};
let fails=0,lockTo=0;
function gate(){
  if(!(window.crypto&&crypto.subtle))return toast('Browser tidak mendukung enkripsi PIN');
  if(!state.security)return pinForm(true);
  const pin=h('input',{type:'password',placeholder:'PIN',autocomplete:'current-password'}),msg=h('p',{class:'note'});
  const go=async close=>{
    const w=lockTo-Date.now();if(w>0){msg.textContent='Terlalu banyak percobaan. Tunggu '+Math.ceil(w/1000)+' detik.';return}
    if(await hashPin(pin.value,state.security.salt)===state.security.hash){fails=0;close();enter()}
    else{fails++;if(fails>=3)lockTo=Date.now()+Math.min(300,15*2**(fails-3))*1000;msg.textContent='PIN salah.';pin.value=''}
  };
  modal('Masuk Mode Edit',h('div',{},fld('Masukkan PIN admin',pin),msg),close=>{pin.onkeydown=e=>{if(e.key==='Enter')go(close)};return[h('button',{class:'btn',onclick:close},'Batal'),h('button',{class:'btn pri',onclick:()=>go(close)},'Masuk')]});
  setTimeout(()=>pin.focus(),50);

function pinForm(first){
  const a=h('input',{type:'password',placeholder:'Minimal 6 karakter'}),b=h('input',{type:'password',placeholder:'Ulangi PIN'});
  modal(first?'Buat PIN Admin':'Ganti PIN',h('div',{},h('p',{class:'note'},first?'Buat PIN agar mode edit terkunci. PIN disimpan dalam bentuk hash, bukan teks asli.':'PIN baru berlaku setelah Anda menekan “Simpan & Terbitkan”.'),fld('PIN baru',a),fld('Ulangi PIN',b)),close=>[h('button',{class:'btn',onclick:close},'Batal'),h('button',{class:'btn pri',onclick:async()=>{
    if(a.value.length<6)return toast('PIN minimal 6 karakter');
    if(a.value!==b.value)return toast('PIN tidak sama');
    const salt=b64(crypto.getRandomValues(new Uint8Array(16))),sec={salt,hash:await hashPin(a.value,salt)};
    close();
    if(first){draft=clone(state);draft.security=sec;editing=true;render();scrollTo(0,0);toast('PIN dibuat — tekan Simpan agar berlaku')}

function build(s){const c=document.documentElement.cloneNode(true);c.querySelector('#app').replaceChildren();c.querySelector('#modal').replaceChildren();const t=c.querySelector('#toast');t.textContent='';t.className='';c.querySelector('#data').textContent=JSON.stringify(s).replace(/</g,'\\u003c');return '<!doctype html>\n'+c.outerHTML}
async function save(){
  state=draft;draft=null;editing=false;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
  if(art){try{toast('Menerbitkan…');await art.publish(build(state))}catch(e){if(e&&e.code==='conflict')return;toast('Gagal menerbitkan: '+((e&&(e.code||e.message))||'error'))}}

render();
(async()=>{
  if(!window.claude||!claude.use)return;
  art=await claude.use('artifact');
  const u=await claude.use('user');
  canEdit=location.hash==='#admin'||!!(art&&u&&u.canEdit());
  if(!art){try{const l=localStorage.getItem(KEY);if(l){state=JSON.parse(l)}}catch{}}
  render();
})();
</script>

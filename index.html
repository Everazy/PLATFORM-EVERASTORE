const enter=()=>{draft=clone(state);editing=true;render();scrollTo(0,0)};
let PW='';try{PW=sessionStorage.getItem('lh:pw')||''}catch{}
const cacheSet=d=>{try{localStorage.setItem('lh:cache',JSON.stringify(d))}catch{}};
const api=async body=>{const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':PW},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}return{...j,status:r.status}};
function ask(onOk){
  const pin=h('input',{type:'password',placeholder:'Password admin',autocomplete:'current-password'}),msg=h('p',{class:'note'});
  const go=async close=>{
    PW=pin.value;msg.textContent='Memeriksa…';let r;
    try{r=await api({action:'login'})}catch{msg.textContent='Tidak bisa terhubung ke server.';return}
    if(r.status===200){try{sessionStorage.setItem('lh:pw',PW)}catch{}close();onOk()}
    else{PW='';pin.value='';msg.textContent=r.status===429||r.status===503?(r.error||'Server belum siap.'):'Password salah.'}
  };
  modal('Masuk Mode Edit',h('div',{},fld('Masukkan password admin',pin),msg),close=>{pin.onkeydown=e=>{if(e.key==='Enter')go(close)};return[h('button',{class:'btn',onclick:close},'Batal'),h('button',{class:'btn pri',onclick:()=>go(close)},'Masuk')]});
  setTimeout(()=>pin.focus(),50);
}
async function gate(){
  if(PW){try{if((await api({action:'login'})).status===200)return enter()}catch{}PW=''}
  ask(enter);
}
async function save(){
  toast('Menyimpan…');let r;
  try{r=await api({action:'save',data:draft})}catch{return toast('Gagal terhubung ke server')}
  if(r.status===200){state=draft;draft=null;editing=false;cacheSet(state);toast('Tersimpan ✓ tampil untuk semua pengunjung');render()}
  else if(r.status===401){PW='';try{sessionStorage.removeItem('lh:pw')}catch{}ask(save)}
  else toast(r.error||'Gagal menyimpan')
}
const admin=()=>location.hash==='#admin';
canEdit=admin();
addEventListener('hashchange',()=>{canEdit=canEdit||admin();if(!editing)render()});
(async()=>{
  let c=null,rendered=false;try{c=JSON.parse(localStorage.getItem('lh:cache'))}catch{}
  if(c&&c.profile&&Array.isArray(c.sections)){state=c;render();rendered=true}else $('#app').style.visibility='hidden';
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
    const r=await fetch('/api/data',{cache:'no-store',signal:ctl.signal});clearTimeout(to);
    if(r.ok){const j=await r.json();if(j.data&&j.data.profile&&Array.isArray(j.data.sections)&&JSON.stringify(j.data)!==JSON.stringify(state)&&!editing){state=j.data;cacheSet(state);render();rendered=true}}
  }catch{}
  if(!rendered)render();
  $('#app').style.visibility='';
})();
</script>
</body>
</html>
